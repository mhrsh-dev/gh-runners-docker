# Copy to .github/workflows/agent.yml in any repo that has agent runners.
#
# Coexists with the Claude GitHub App: that app answers `@claude` on
# ubuntu-latest and commits as claude[bot], this answers `/claude` and `/pi` on
# self-hosted runners and commits as pi-agent[bot]. Comments written by apps are
# skipped here so an app reply quoting `/claude` cannot trigger this workflow.
# Requires: repo variable PI_DEVS (JSON array of allowed logins),
#           repo secret PI_GH_TOKEN (PAT used for push/PR so the agent's PRs can
#           trigger further workflows; GITHUB_TOKEN-created PRs cannot),
#           repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) for
#           the /claude commands.
name: agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  agent:
    if: |
      contains(fromJson(vars.PI_DEVS), github.actor) &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.comment.body, '<!-- agent-reply -->') &&
      (contains(github.event.comment.body, '/pi') ||
       contains(github.event.comment.body, '/claude'))
    runs-on: [self-hosted, agent]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PI_GH_TOKEN }}
      - uses: mhrsh-dev/gh-runners-docker/actions/pi@main
        with:
          mode: comment
          github_token: ${{ secrets.PI_GH_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
