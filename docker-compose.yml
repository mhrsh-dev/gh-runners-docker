# Persistent self-hosted runners for one repository.
# Bring up with scripts/up.sh <repo> so each repo gets its own compose project.
x-runner: &runner
  restart: always
  environment: &runner-env
    ACCESS_TOKEN: ${GH_PAT:?set GH_PAT in envs/<repo>.env}
    RUNNER_SCOPE: repo
    REPO_URL: ${REPO_URL:?set REPO_URL in envs/<repo>.env}
    # Reuse the registration across restarts instead of re-registering.
    CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-config
    DISABLE_AUTOMATIC_DEREGISTRATION: "true"
    RUNNER_WORKDIR: /_work

services:
  base:
    <<: *runner
    image: gh-runners/base:latest
    build:
      context: .
      dockerfile: Dockerfile.base
    environment:
      <<: *runner-env
      RUNNER_NAME_PREFIX: ${RUNNER_PREFIX:-runner}-base
      LABELS: docker,base
    volumes:
      - base-config:/runner-config
      - base-work:/_work

  agent:
    <<: *runner
    image: gh-runners/agent:latest
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        BASE_IMAGE: gh-runners/base:latest
    depends_on:
      - base
    environment:
      <<: *runner-env
      RUNNER_NAME_PREFIX: ${RUNNER_PREFIX:-runner}-agent
      LABELS: docker,agent
    volumes:
      - agent-config:/runner-config
      - agent-work:/_work
      - pi-agent-home:/pi-home

  # Same image as `agent`, separate runner so long autonomous jobs never block
  # interactive comment replies.
  agent-worker:
    <<: *runner
    image: gh-runners/agent:latest
    depends_on:
      - agent
    environment:
      <<: *runner-env
      RUNNER_NAME_PREFIX: ${RUNNER_PREFIX:-runner}-agent-worker
      LABELS: docker,agent-worker
    volumes:
      - agent-worker-config:/runner-config
      - agent-worker-work:/_work
      - pi-agent-home:/pi-home

  # Not a runner: one-time interactive `pi` for /login. See scripts/login-pi.sh.
  pi-login:
    image: gh-runners/agent:latest
    profiles: ["login"]
    entrypoint: ["pi"]
    stdin_open: true
    tty: true
    environment:
      PI_CODING_AGENT_DIR: /pi-home/agent
      TERM: ${TERM:-xterm-256color}
    volumes:
      - pi-agent-home:/pi-home

volumes:
  base-config:
  base-work:
  agent-config:
  agent-work:
  agent-worker-config:
  agent-worker-work:
  # Shared by both agent runners. Holds the pi provider credentials from /login;
  # Claude Code authenticates from CLAUDE_CODE_OAUTH_TOKEN instead.
  pi-agent-home:
    name: pi-agent-home
    external: false
