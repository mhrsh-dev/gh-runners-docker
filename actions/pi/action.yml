name: "coding agent"
description: "Run a coding agent (pi or Claude Code) on a self-hosted agent runner and post its answer as a comment."
inputs:
  mode:
    description: "comment (dispatch on a /command in the triggering comment) or auto (label-driven)."
    required: false
    default: comment
  profile:
    description: "Profile to force. Defaults to dispatch for mode=comment, pi-auto for mode=auto."
    required: false
    default: ""
  claude_code_oauth_token:
    description: "Token from `claude setup-token`. Required by profiles whose engine is claude."
    required: false
    default: ""
  github_token:
    description: "Token used for gh, git push and posting the comment. Use a PAT if PRs pi opens should trigger workflows."
    required: true
  post_comment:
    description: "Post the agent's final message as a comment."
    required: false
    default: "true"
outputs:
  answer_file:
    description: "Path to the agent's final message."
    value: ${{ steps.pi.outputs.answer_file }}
  events_file:
    description: "Path to the engine's raw structured output."
    value: ${{ steps.pi.outputs.events_file }}
runs:
  using: composite
  steps:
    - id: pi
      shell: bash
      env:
        PI_MODE: ${{ inputs.mode }}
        PI_PROFILE: ${{ inputs.profile }}
        PI_POST_COMMENT: ${{ inputs.post_comment }}
        GH_TOKEN: ${{ inputs.github_token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        PI_ACTION_DIR: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/run.sh"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pi-events-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.pi.outputs.events_file }}
        if-no-files-found: ignore
        retention-days: 7
